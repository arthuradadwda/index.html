<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GMODEIROS RP</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial,Helvetica,sans-serif;color:#fff;background:radial-gradient(circle at top,#242424 0%,#0d0d0d 45%,#050505 100%)}
.card{width:min(92%,520px);text-align:center;padding:55px 35px;border:1px solid #333;border-radius:22px;background:rgba(18,18,18,.92);box-shadow:0 20px 60px rgba(0,0,0,.55)}
.logo{font-size:42px;font-weight:900;letter-spacing:2px}.sub{margin-top:12px;color:#aaa;font-size:16px}
.ip{margin:28px auto;padding:14px 18px;width:max-content;max-width:100%;border-radius:10px;background:#090909;border:1px solid #333;color:#ddd;font-family:monospace;font-size:16px}
.button{display:inline-block;padding:16px 32px;border-radius:12px;background:#fff;color:#080808;text-decoration:none;font-weight:800;font-size:17px;transition:.2s}.button:hover{transform:translateY(-2px) scale(1.02);background:#ddd}
.footer{margin-top:25px;color:#666;font-size:13px}
</style>
</head>
<body>
<div class="card">
<div class="logo">GMODEIROS RP</div>
<div class="sub">Entre diretamente no nosso servidor</div>
<div class="ip">104.234.189.67:27215</div>
<a class="button" href="steam://connect/104.234.189.67:27215">ENTRAR NO SERVIDOR</a>
<div class="footer">Garry's Mod • GMODEIROS</div>
</div>
